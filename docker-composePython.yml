version: '3'
services:
  apache:
    image: httpd:latest
    container_name: apache
    restart: always
    ports:
      - 7777:80 # Puerto público para Apache
    volumes:
      - ./WEB/static:/usr/local/apache2/htdocs/ # Sirve tu cliente desde la carpeta 'static'
      - ./config/demo.apache.conf:/usr/local/apache2/conf/httpd.conf # Archivo de configuración de Apache
    depends_on:
      - python

  mariadb:
    image: mariadb:latest
    container_name: mariadb
    restart: always
    environment:
      MARIADB_ROOT_PASSWORD: example
      MARIADB_USER: agente
      MARIADB_PASSWORD: 0traClave
      MARIADB_DATABASE: PEPS
    volumes:
      - ./mariadb_data:/var/lib/mysql
      - ./Salas.sql:/docker-entrypoint-initdb.d/Salas.sql
    networks:
      - internal

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: phpmyadmin
    restart: always
    environment:
      PMA_HOST: mariadb
    ports:
      - 9093:80
    depends_on:
      - mariadb
    networks:
      - internal

  python:
    build: .
    container_name: python
    environment:
      DB_USERNAME: root
      DB_PASSWORD: example
      DB_DATABASE: PEPS
      DB_HOST: mariadb
      DB_PORT: 3306
      PORT: 8080
      HOST: 0.0.0.0
      PYTHONBUFFERED: 1
    depends_on:
      - mariadb
    networks:
      - internal

networks:
  internal:
    driver: bridge
