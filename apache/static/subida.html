<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.2/css/bulma.min.css">
        <script>
            var myHeaders = new Headers();
            myHeaders.append("Content-Type", "application/json");
            onload=()=>{
                    if (sessionStorage.getItem("csrf_token")){
                        myHeaders.append("X-CSRFToken",sessionStorage.getItem("csrf_token"))
                    }
            }
            
            function enviarArchivo(){
                const formData = new FormData();
                formData.append('fichero',document.getElementById("fichero").files[0]);
                formData.append('nombre',document.getElementById("nombre").value);
                var requestOptions = {
                    method: 'POST',
                    body: formData,
                    headers: myHeaders
                };
                fetch("/api/upload", requestOptions)
                    .then(response => response.json())
                    .then(result => {
                        if (result.status == "OK"){
                            alert("archivo subido correctamente");
                            location.href="index.html"
                        } else {
                            alert("El archivo no ha podido subirse");
                        }
                    })
                    .catch(error => {
                        console.log('error', error);
                        alert("Ha habido un error al recuperar el archivo. Refresque la página")
                    });
            }

            function verArchivo(){
                var requestOptions = {
                    method: 'GET',
                };
                fetch("/api/ver/" + document.getElementById("nombreArchivo").value, requestOptions)
                    .then(response => response.json())
                    .then(result => {
                        if (result.status == "OK"){
                            document.getElementById("contenidoArchivo").innerText=result.contenido;
                        } else {
                            document.getElementById("contenidoArchivo").innerText="EL CONTENIDO NO ESTA DISPONIBLE";                        
                        }
                    })
                    .catch(error => {
                        console.log('error', error);
                        alert("Ha habido un error al recuperar el archivo. Refresque la página")
                    });
            }
            function cerrarSesion(){
                var requestOptions = {
                    method: 'GET',
                    headers: myHeaders
                };
                fetch("/api/logout", requestOptions)
                    .then(response => response.json())
                    .then(result => {
                        if (result.status == "OK"){
                            location.href="index.html";
                        } else {
                            alert("No se ha podido cerrar sesión")
                        }
                    })
                    .catch(error => {
                        console.log('error', error);
                        alert("Se ha producido un error y no se ha podido cerrar sesión")
                    });
            }
        </script>
    </head>
    <body>
        <nav class="navbar is-warning" role="navigation" aria-label="main navigation">
            <div class="navbar-brand">
                <button class="navbar-burger is-warning button" aria-label="menu" aria-expanded="false" data-target="navbarBasicExample">
                    <span aria-hidden="true"></span>
                    <span aria-hidden="true"></span>
                    <span aria-hidden="true"></span>
                </button>
            </div>
            <div class="navbar-menu">
                <div class="navbar-start">
                    <a class="navbar-item" href="salas.html">Salas</a>
                    <a class="navbar-item" href="subida.html">Archivos</a>
                    <a class="navbar-item" href="javascript:cerrarSesion()">Cerrar sesion</a>
                </div>
                <div class="navbar-end">
                    <div class="navbar-item">
                    </div>
                </div>
            </div>
        </nav>
        <section class="section">
            <div class="columns">
                <div class="column">
                    <h3 class="is-size-3">Subir un archivo</h3>
                    <form>
                        <label for="nombre">Nombre archivo:</label>
                        <input required type="text" class="input" placeholder="Nombre" name="nombre" id="nombre">
                        <label for="fichero">Archivo</label>
                        <input required type="file" class="input" name="fichero" id="fichero">
                        <button type="button" onclick="enviarArchivo()">ENVIAR</button><br>
                    </form></br>
                    <h3 class="is-size-3">Ver contenido de un archivo</h3>
                    <form>
                        <label for="nombreArchivo">Nombre archivo:</label>
                        <input required type="text" class="input" placeholder="nombreArchivo" name="nombreArchivo" id="nombreArchivo">
                        <button type="button" onclick="verArchivo()">Ver</button><br>
                        <label for="contenidoArchivo">Contenido archivo</label><textarea name="contenidoArchivo" id="contenidoArchivo"></textarea><br>
                    </form>
                </div>
            </div>
        </section>
    </body>
</html>
