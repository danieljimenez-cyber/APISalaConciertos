<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>APP PEPS</title>
        <style>
            .error{
                display: none;
                color: red;
            }
        </style>
        <script>
            var myHeaders = new Headers();
            myHeaders.append("Content-Type", "application/json");

            function conectar(){
                document.getElementsByClassName("error")[0].style.display="none";
                var raw = JSON.stringify({
                    "username": document.getElementById("username").value,
                    "password": document.getElementById("password").value
                });
                
                var requestOptions = {
                    method: 'POST',
                    headers: myHeaders,
                    body: raw
                };

                fetch("/api/login", requestOptions)
                    .then(response => response.json())
                    .then(result => {
                        if (result.status=="OK"){
                            sessionStorage.setItem("csrf_token",result.csrf_token)
                            sessionStorage.setItem("perfil",result.perfil)
                            location.href="salas.html";
                        } else {
                            document.getElementsByClassName("error")[0].style.display="block";
                        }
                    })
                    .catch(error => console.log('error', error)); 
            }
        </script>
    </head>
    <body style="text-align: center;">
        <h1>INICIO DE SESION DEL SISTEMA</h1>
        <p><label>Usuario</label><input type="text" name="username" id="username"></p>
        <p><label>Clave</label><input type="password" name="password" id="password"></p>
        <label class="error">Usuario/clave erronea</label>
        <button type="button" onclick="conectar()">ENVIAR</button>
        <button type="button" onclick="location.href='registro.html'">REGISTRARSE</button>
    </body>
</html>
