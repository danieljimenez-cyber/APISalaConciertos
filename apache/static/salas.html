<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>EJEMPLO APP WEB CON CRUD</title>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.2/css/bulma.min.css">
        <style>
            .oculto{
                display: none;
            }
        </style>
        <script>
            var myHeaders = new Headers();
            myHeaders.append("Content-Type", "application/json");
            if (sessionStorage.getItem("csrf_token")){
                myHeaders.append("X-CSRFToken",sessionStorage.getItem("csrf_token"))
            }
            var perfil="normal";
            onload=function(){
                if (sessionStorage.getItem("perfil")){
                    perfil=sessionStorage.getItem("perfil")
                    if (perfil=="admin"){
                        document.getElementById("enlaceAgregar").classList.remove("oculto");
                    }
                } 
                pedirSalas();
            }
            function pintarSalas(lista){
                let tbody=document.getElementsByTagName("tbody")[0];
                tbody.innerHTML="";
                lista.forEach(sala => {
                    let texto=`<tr>
                            <td><img src="${sala.foto}" width="70"></td>
                            <td>${sala.nombre}</td>
                            <td>${sala.descripcion}</td>
                            <td>${sala.precio}</td>
                            <td>${sala.precio*0.21+sala.precio}</td>
                            <td>`
                    if (perfil=="admin"){
                        texto+=`<a href="editar_sala.html?id=${sala.id}" class="button is-info">Editar</a>
                            </td>
                            <td>
                                <button class="button is-danger" onclick="eliminarsala(${sala.id})">Eliminar</button>
                            </td>`
                    } else{
                        texto+=`<td></td><td></td>`
                    } 
                    texto+=`</tr>`;
                    tbody.innerHTML+=texto                            
                });
            }
            function pedirSalas(){
                var requestOptions = {
                    method: 'GET',
                    headers: myHeaders
                };

                fetch("/api/salas", requestOptions)
                    .then(response => response.json())
                    .then(result => {
                        if (result.status){
                            location.href="index.html";
                        } else {
                            pintarSalas(result);
                        }
                    })
                    .catch(error => {
                        console.log('error', error);
                        alert("Ha habido un error al recuperar los salas. Refresque la página")
                    });
            }
            function eliminarsala(id){
                var requestOptions = {
                    method: 'DELETE',
                    headers: myHeaders
                };

                fetch("/api/salas/"+id, requestOptions)
                    .then(response => response.json())
                    .then(result => {
                        if (result.status == "OK"){
                            alert("sala eliminado")
                            pedirSalas();
                        } else {
                            alert("El sala no ha podido ser eliminado")
                        }
                    })
                    .catch(error => {
                        console.log('error', error);
                        alert("Se ha producido un error y el sala no ha podido ser eliminado")
                    });
            }
            function cerrarSesion(){
                var requestOptions = {
                    method: 'GET',
                    headers: myHeaders
                };
                fetch("/api/logout", requestOptions)
                    .then(response => response.json())
                    .then(result => {
                        if (result.status == "OK"){
                            location.href="index.html";
                        } else {
                            alert("No se ha podido cerrar sesión")
                        }
                    })
                    .catch(error => {
                        console.log('error', error);
                        alert("Se ha producido un error y no se ha podido cerrar sesión")
                    });
            }
        </script>
    </head>
    <body>
        <nav class="navbar is-warning" role="navigation" aria-label="main navigation">
            <div class="navbar-brand">
                <button class="navbar-burger is-warning button" aria-label="menu" aria-expanded="false" data-target="navbarBasicExample">
                    <span aria-hidden="true"></span>
                    <span aria-hidden="true"></span>
                    <span aria-hidden="true"></span>
                </button>
            </div>
            <div class="navbar-menu">
                <div class="navbar-start">
                    <a class="navbar-item" href="salas.html">Salas</a>
                    <a class="navbar-item" href="subida.html">Archivos</a>
                    <a class="navbar-item" href="javascript:cerrarSesion()">Cerrar sesion</a>
                </div>
                <div class="navbar-end">
                    <div class="navbar-item">
                    </div>
                </div>
            </div>
        </nav>
        <section class="section">
            <div class="columns">
                <div class="column">
                    <h3 class="is-size-3">Salas</h3>
                    <a id="enlaceAgregar" href="agregar_sala.html" class="button is-success oculto">Agregar</a>
                    <table class="table">
                        <thead>
                            <tr>
                                <th>Imagen</th>
                                <th>Nombre</th>
                                <th>Descripción</th>
                                <th>Precio</th>
                                <th>PrecioIVA</th>
                                <th>Editar</th>
                                <th>Eliminar</th>
                            </tr>
                        </thead>
                        <tbody>
                        </tbody>
                    </table>
                </div>
            </div>  
        </section>    
    </body>
</html>
