<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>APP PEPS</title>
        <style>
            .error{
                display: none;
                color: red;
            }
        </style>
        <script>
            var myHeaders = new Headers();
            myHeaders.append("Content-Type", "application/json");

            function conectar(){
                document.getElementsByClassName("error")[0].style.display="none";
                var raw = JSON.stringify({
                    "username": document.getElementById("username").value,
                    "password": document.getElementById("password").value,
                    "email": document.getElementById("email").value,
                    "profile": document.getElementById("profile").value
                });

                var requestOptions = {
                    method: 'POST',
                    headers: myHeaders,
                    body: raw
                };

                fetch("/api/registro", requestOptions)
                    .then(response => response.json())
                    .then(result => {
                        if (result.status=="OK"){
                            alert("Usuario registrado correctamente");
                            location.href="index.html";
                        } else {
                            document.getElementsByClassName("error")[0].style.display="block";
                        }
                    })
                    .catch(error => console.log('error', error)); 
            }
        </script>
    </head>
    <body style="text-align: center;">
        <h1>REGISTRO DEL SISTEMA</h1>
        <p><label>Usuario</label><input type="text" name="username" id="username" required></p>
        <p><label>Clave</label><input type="password" name="password" id="password" required></p>
        <p><label>Correo</label><input type="email" name="email" id="email" required></p>
        <p><label>Perfil</label><input type="text" disabled name="profile" id="profile" value="normal"></p>
        <label class="error">Usuario ya existe</label>
        <button type="button" onclick="conectar()">ENVIAR</button>
    </body>
</html>
